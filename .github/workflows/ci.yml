name: CI

# This repository is a Kotlin Multiplatform *library* (`androidLibrary` + `jvm("desktop")`).
# There is no `com.android.application` module and no `app/` directory, so there is no APK to
# build, sign, or release -- the previous `android-ci.yml` invoked `./gradlew test` and
# `./gradlew assembleDebug`, neither of which is a task this project registers (verified
# locally: "Task 'test' not found in root project 'conveyance-expressive'").
#
# The real task names (from `./gradlew tasks --all`) are:
#   allTests            -- runs the tests for all targets and aggregates the report
#   desktopTest         -- the desktop (JVM) test run on its own
#   assemble            -- assembles the library outputs (AAR + desktop jar + klib metadata)
#   publishToMavenLocal -- exercises the `maven-publish` path JitPack consumes
#
# The publish story is JitPack (see README): consumers resolve
# `com.github.HereLiesAz:conveyance-expressive:main-SNAPSHOT` straight from this repo, and
# JitPack drives `maven-publish` itself. There is nothing for CI to upload, so in place of an
# APK build/release job this workflow just verifies that the publication actually builds.
#
# The two jobs are split because only the second needs an Android SDK: `allTests` currently
# resolves to the desktop target alone, so test results are never hidden behind Android SDK
# provisioning.

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          dependency-graph: generate-submit-and-upload

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew allTests --continue --build-cache --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  library:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # `androidLibrary` needs a real SDK to assemble its AAR. This also accepts the SDK
      # licenses, which is what lets AGP fetch the `compileSdk` platform itself.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble library outputs
        run: ./gradlew assemble --build-cache --stacktrace

      - name: Verify the JitPack publication builds
        run: ./gradlew publishToMavenLocal --build-cache --stacktrace
