[versions]
agp = "9.3.1"
gradle = "9.7.1"
kotlin = "2.4.10"
compose = "1.11.1"
compileSdk = "37"
compileSdkMinor = "1"
minSdk = "24"
jvmToolchain = "21"
# Pinned to Conveyance's own version -- this is what ships MaterialShapes/Morph. Used as
# geometry only: the shape/motion vocabulary here is this library's own, never M3's ColorScheme
# or component set. graphics-shapes (Morph, RoundedPolygon) has been commonMain-safe since 1.1.0,
# well before this alpha, so it's declared in commonMain rather than androidMain-only.
androidxMaterial3 = "1.5.0-alpha26"

[libraries]
androidx-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidxMaterial3" }

[plugins]
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
